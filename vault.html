<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c14" />
  <title>The Vault · Charlie Puth</title>
  <meta name="description" content="99 unreleased Charlie Puth tracks." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:       #0c0c14;
      --bg2:      #12121e;
      --border:   rgba(255,255,255,0.07);
      --red:      #e05c4b;
      --red-dim:  rgba(224,92,75,0.15);
      --text:     #e8e2d9;
      --sub:      rgba(232,226,217,0.45);
      --muted:    rgba(232,226,217,0.22);
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    html {
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ────────────────────────────────────────
       NAV
    ──────────────────────────────────────── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 0;
      max-width: 680px;
      margin: 0 auto;
    }

    .nav-brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .nav-search {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--sub);
      padding: 6px;
      border-radius: 50%;
      display: flex;
      transition: color 0.2s;
    }
    .nav-search:hover { color: var(--text); }

    /* ────────────────────────────────────────
       STICKY PLAYER
    ──────────────────────────────────────── */
    .player-wrap {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 24px 24px 0;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ────────────────────────────────────────
       VINYL
    ──────────────────────────────────────── */
    .vinyl-stage {
      display: flex;
      justify-content: center;
      padding-bottom: 28px;
    }

    .vinyl {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      /* concentric groove rings via repeating-radial-gradient */
      background:
        /* center solid area */
        radial-gradient(circle at center, #191919 0%, #151515 100%),
        /* groove pattern */
        repeating-radial-gradient(
          circle at center,
          #1a1a1a 0px,
          #1a1a1a 8px,
          #212121 8px,
          #212121 9px
        );
      /* override: stack them */
      background:
        radial-gradient(circle at center, #1d1d1d 0 18%, #151515 18.5% 19%, #1d1d1d 19% 34%, #151515 34.5% 35%, #1d1d1d 35% 50%, #151515 50.5% 51%, #1d1d1d 51% 66%, #151515 66.5% 67%, #1d1d1d 67% 82%, #151515 82.5% 83%, #1d1d1d 83% 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 24px 64px rgba(0,0,0,0.75),
        0 8px 24px rgba(0,0,0,0.6);
      animation: spin 3.2s linear infinite;
      animation-play-state: paused;
      will-change: transform;
    }

    .vinyl.spinning { animation-play-state: running; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Sheen overlay */
    .vinyl::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 120deg,
        rgba(255,255,255,0.04) 0deg,
        rgba(255,255,255,0) 60deg,
        rgba(255,255,255,0.02) 120deg,
        rgba(255,255,255,0) 180deg,
        rgba(255,255,255,0.04) 240deg,
        rgba(255,255,255,0) 300deg
      );
      pointer-events: none;
    }

    /* Center label */
    .vinyl-label {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 35%, var(--lc1, #e05c4b), var(--lc2, #7a1f15));
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Spindle hole */
    .vinyl-label::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ────────────────────────────────────────
       SONG INFO
    ──────────────────────────────────────── */
    .song-info {
      text-align: center;
      padding-bottom: 20px;
    }

    .song-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 8px;
      min-height: 1.2em;
      /* animate via JS */
      transition: opacity 0.25s ease;
    }

    .song-meta {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ────────────────────────────────────────
       PROGRESS
    ──────────────────────────────────────── */
    .prog-section {
      padding-bottom: 18px;
    }

    .prog-bar {
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }
    .prog-bar:hover { height: 5px; }

    .prog-fill {
      height: 100%;
      width: 0%;
      background: var(--red);
      border-radius: 3px;
      pointer-events: none;
      transition: width 0.28s linear;
    }

    .prog-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ────────────────────────────────────────
       CONTROLS
    ──────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-bottom: 28px;
    }

    .cb {
      display: flex; align-items: center; justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      color: var(--sub);
      width: 44px; height: 44px;
      transition: color 0.2s, background 0.2s, transform 0.12s cubic-bezier(0.32,0.72,0,1);
    }
    .cb:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .cb:active { transform: scale(0.88); }

    .cb.play {
      width: 56px; height: 56px;
      background: var(--red);
      color: #fff;
    }
    .cb.play:hover { background: #ea7060; color: #fff; }
    .cb.play:active { transform: scale(0.92); }

    /* ────────────────────────────────────────
       DIVIDER
    ──────────────────────────────────────── */
    .divider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px 16px;
      max-width: 680px;
      margin: 0 auto;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ────────────────────────────────────────
       SEARCH OVERLAY
    ──────────────────────────────────────── */
    .search-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(12,12,20,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .search-overlay.open {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .search-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-field {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }
    .search-field::placeholder { color: var(--muted); }
    .search-field:focus { border-color: rgba(224,92,75,0.4); }
    .search-field::-webkit-search-cancel-button { display: none; }

    .search-close {
      background: none; border: none; cursor: pointer;
      color: var(--sub); font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500; letter-spacing: 0.05em;
      padding: 8px 0;
    }
    .search-close:hover { color: var(--text); }

    .search-results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .search-result-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-result-row:hover { background: rgba(255,255,255,0.03); }
    .search-result-num {
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
      letter-spacing: 0.06em;
    }
    .search-result-title {
      flex: 1;
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .search-result-dur {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      letter-spacing: 0.05em;
    }

    /* ────────────────────────────────────────
       TRACK LIST
    ──────────────────────────────────────── */
    .track-list {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
      padding-bottom: calc(32px + var(--safe-b));
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 56px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .track-row:hover { background: rgba(255,255,255,0.025); }

    .track-row.active {
      background: var(--red-dim);
    }
    .track-row.active::before {
      content: '';
      position: absolute;
      left: -24px; top: 0; bottom: 0;
      width: 2px;
      background: var(--red);
    }

    /* Number / EQ */
    .trk-left {
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .trk-num {
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .track-row.active .trk-num { display: none; }

    .eq {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }
    .track-row.active .eq { display: flex; }

    .eq-b {
      width: 2.5px;
      background: var(--red);
      border-radius: 1px;
    }
    .eq-b:nth-child(1) { animation: eb1 0.65s ease-in-out infinite alternate; }
    .eq-b:nth-child(2) { animation: eb2 0.5s  ease-in-out infinite alternate; }
    .eq-b:nth-child(3) { animation: eb3 0.85s ease-in-out infinite alternate; }

    @keyframes eb1 { from { height: 3px; } to { height: 13px; } }
    @keyframes eb2 { from { height: 6px; } to { height: 11px; } }
    @keyframes eb3 { from { height: 2px; } to { height: 14px; } }

    .track-row.active.paused .eq-b { animation-play-state: paused; opacity: 0.4; }

    .trk-title {
      flex: 1;
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.01em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      transition: color 0.2s;
    }
    .track-row.active .trk-title { color: var(--red); font-weight: 500; }

    .trk-dur {
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      flex-shrink: 0;
      letter-spacing: 0.05em;
      min-width: 34px;
      text-align: right;
    }
    .track-row.active .trk-dur { color: var(--red); }

    /* ────────────────────────────────────────
       HIDDEN YT
    ──────────────────────────────────────── */
    #yt-mount {
      position: fixed;
      top: -9999px; left: -9999px;
      width: 1px; height: 1px;
      opacity: 0; pointer-events: none;
    }

    /* Desktop: wider max, slightly bigger vinyl */
    @media (min-width: 640px) {
      .vinyl { width: 280px; height: 280px; }
      .vinyl-label { width: 90px; height: 90px; }
      .song-title { font-size: 40px; }
      .track-row { min-height: 52px; }
      .trk-title { -webkit-line-clamp: 1; font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-top">
      <input class="search-field" type="search" id="searchField" placeholder="Search the vault…" autocomplete="off" autocorrect="off" />
      <button class="search-close" id="searchClose">Close</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- Nav -->
  <nav class="nav">
    <span class="nav-brand">The Vault</span>
    <button class="nav-search" id="navSearch" aria-label="Search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </nav>

  <!-- Sticky player -->
  <div class="player-wrap">

    <!-- Vinyl -->
    <div class="vinyl-stage">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label" id="vinylLabel"></div>
      </div>
    </div>

    <!-- Song info -->
    <div class="song-info">
      <div class="song-title" id="songTitle">Charlie Puth</div>
      <div class="song-meta" id="songMeta">The Vault · 99 Unreleased Tracks</div>
    </div>

    <!-- Progress -->
    <div class="prog-section">
      <div class="prog-bar" id="progBar">
        <div class="prog-fill" id="progFill"></div>
      </div>
      <div class="prog-times">
        <span id="tCur">0:00</span>
        <span id="tTotal">--:--</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="cb" id="btnPrev" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button class="cb play" id="btnPlay" aria-label="Play / Pause">
        <svg id="iPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="cb" id="btnNext" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

  </div><!-- /player-wrap -->

  <!-- Section label -->
  <div class="divider-row">
    <div class="divider-line"></div>
    <div class="divider-label">All Tracks</div>
    <div class="divider-line"></div>
  </div>

  <!-- Track list -->
  <div class="track-list" id="trackList"></div>

  <!-- Hidden YT mount -->
  <div id="yt-mount"><div id="yt-player"></div></div>

  <script src="final_songs.js"></script>
  <script>
  (() => {
    'use strict';

    const songs = (typeof SONGS !== 'undefined' ? SONGS : []).map((s, i) => ({ ...s, _i: i }));

    // LocalStorage duration cache
    const DK = 'vault_dur_v3';
    let dc = {};
    try { dc = JSON.parse(localStorage.getItem(DK) || '{}'); } catch(e) {}
    songs.forEach(s => { if (s.youtubeId && dc[s.youtubeId]) s.duration = dc[s.youtubeId]; });
    function saveDc() { try { localStorage.setItem(DK, JSON.stringify(dc)); } catch(e) {} }

    let cur = -1, playing = false, ytP = null, ytOK = false, timer = null, dragging = false;

    // ── Helpers ──
    function fmt(s) {
      if (!s || !isFinite(s) || s <= 0) return '--:--';
      return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    }
    function isDummy(d) { return !d || d === 180; }

    // Deterministic 2-color label from song title
    function labelColors(title) {
      let h = 0;
      for (let i = 0; i < title.length; i++) h = ((h << 5) - h + title.charCodeAt(i)) | 0;
      const hue = ((h >>> 0) % 360);
      return [
        `hsl(${hue},55%,38%)`,
        `hsl(${(hue+30)%360},60%,22%)`
      ];
    }

    // ── DOM ──
    const $ = id => document.getElementById(id);
    const vinyl      = $('vinyl');
    const vinylLabel = $('vinylLabel');
    const songTitle  = $('songTitle');
    const songMeta   = $('songMeta');
    const progBar    = $('progBar');
    const progFill   = $('progFill');
    const tCur       = $('tCur');
    const tTotal     = $('tTotal');
    const btnPlay    = $('btnPlay');
    const btnPrev    = $('btnPrev');
    const btnNext    = $('btnNext');
    const iPlay      = $('iPlay');
    const iPause     = $('iPause');
    const trackList  = $('trackList');
    const navSearch  = $('navSearch');
    const overlay    = $('searchOverlay');
    const searchField= $('searchField');
    const searchClose= $('searchClose');
    const searchRes  = $('searchResults');

    // ── Render track list ──
    function renderList() {
      trackList.innerHTML = songs.map((s, vi) => {
        const a = s._i === cur;
        return `<div class="track-row${a?' active':''}${a&&!playing?' paused':''}" data-i="${s._i}">
          <div class="trk-left">
            <span class="trk-num">${String(vi+1).padStart(2,'0')}</span>
            <div class="eq"><div class="eq-b"></div><div class="eq-b"></div><div class="eq-b"></div></div>
          </div>
          <div class="trk-title">${esc(s.title)}</div>
          <div class="trk-dur">${isDummy(s.duration)?'--:--':fmt(s.duration)}</div>
        </div>`;
      }).join('');

      trackList.querySelectorAll('.track-row').forEach(row => {
        row.addEventListener('click', () => {
          const i = +row.dataset.i;
          i === cur ? toggle() : play(i);
        });
      });
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function refreshRows() {
      trackList.querySelectorAll('.track-row').forEach(row => {
        const i = +row.dataset.i;
        const a = i === cur;
        row.classList.toggle('active', a);
        row.classList.toggle('paused', a && !playing);
        if (a) row.querySelector('.trk-dur').textContent = isDummy(songs[i].duration) ? '--:--' : fmt(songs[i].duration);
      });
    }

    // ── Play ──
    function play(i) {
      if (i < 0 || i >= songs.length) return;
      cur = i;
      const s = songs[i];

      // Animate title swap
      songTitle.style.opacity = '0';
      setTimeout(() => {
        songTitle.textContent = s.title;
        songTitle.style.opacity = '1';
      }, 200);

      songMeta.textContent = `Track ${i+1} of ${songs.length}`;
      tTotal.textContent = isDummy(s.duration) ? '--:--' : fmt(s.duration);
      tCur.textContent = '0:00';
      progFill.style.width = '0%';
      playing = true;
      setIcons(true);
      vinyl.classList.add('spinning');

      // Vinyl label colors
      const [c1, c2] = labelColors(s.title);
      vinylLabel.style.setProperty('--lc1', c1);
      vinylLabel.style.setProperty('--lc2', c2);

      if (s.youtubeId && ytOK && ytP) ytP.loadVideoById(s.youtubeId);

      refreshRows();
      scrollToRow(i);
    }

    function toggle() {
      if (cur === -1) { play(0); return; }
      const s = songs[cur];
      if (s.youtubeId && ytOK && ytP) {
        playing ? ytP.pauseVideo() : ytP.playVideo();
      }
    }

    function next() {
      if (!songs.length) return;
      play((cur + 1) % songs.length);
    }

    function prev() {
      if (!songs.length) return;
      play((cur - 1 + songs.length) % songs.length);
    }

    function setIcons(p) {
      iPlay.style.display  = p ? 'none' : '';
      iPause.style.display = p ? '' : 'none';
    }

    function scrollToRow(i) {
      const row = trackList.querySelector(`.track-row[data-i="${i}"]`);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── YT API ──
    window.onYouTubeIframeAPIReady = function() {
      ytP = new YT.Player('yt-player', {
        height: '1', width: '1', videoId: '',
        playerVars: { playsinline: 1, controls: 0, rel: 0, fs: 0, disablekb: 1, iv_load_policy: 3 },
        events: {
          onReady() {
            ytOK = true;
            ytP.setVolume(88);
          },
          onStateChange(ev) {
            if (ev.data === YT.PlayerState.PLAYING) {
              playing = true;
              setIcons(true);
              vinyl.classList.add('spinning');
              refreshRows();
              startTimer();
              // Capture real duration
              if (cur !== -1 && ytP.getDuration) {
                const real = ytP.getDuration();
                if (real && real > 3) {
                  songs[cur].duration = real;
                  tTotal.textContent = fmt(real);
                  if (songs[cur].youtubeId) { dc[songs[cur].youtubeId] = real; saveDc(); }
                  refreshRows();
                }
              }
            } else if (ev.data === YT.PlayerState.PAUSED) {
              playing = false;
              setIcons(false);
              vinyl.classList.remove('spinning');
              refreshRows();
              stopTimer();
            } else if (ev.data === YT.PlayerState.ENDED) {
              playing = false;
              vinyl.classList.remove('spinning');
              stopTimer();
              next();
            }
          }
        }
      });
    };

    // ── Progress timer ──
    function startTimer() {
      stopTimer();
      timer = setInterval(() => {
        if (!ytOK || !ytP?.getCurrentTime || dragging) return;
        const c = ytP.getCurrentTime() || 0;
        const d = ytP.getDuration() || 0;
        tCur.textContent = fmt(c);
        if (d > 0) progFill.style.width = `${(c/d)*100}%`;
      }, 300);
    }

    function stopTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    // ── Scrub ──
    function scrub(ev) {
      if (cur === -1 || !ytOK || !ytP) return;
      const rect = progBar.getBoundingClientRect();
      const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      const pct = Math.max(0, Math.min(1, x / rect.width));
      const d = ytP.getDuration() || 0;
      if (d > 0) {
        ytP.seekTo(pct * d, true);
        progFill.style.width = `${pct * 100}%`;
        tCur.textContent = fmt(pct * d);
      }
    }

    progBar.addEventListener('mousedown', e => { dragging = true; scrub(e); });
    progBar.addEventListener('touchstart', e => { dragging = true; scrub(e); }, { passive: true });
    progBar.addEventListener('click', scrub);
    document.addEventListener('mousemove', e => { if (dragging) scrub(e); });
    document.addEventListener('touchmove', e => { if (dragging) scrub(e); }, { passive: true });
    document.addEventListener('mouseup', () => { dragging = false; });
    document.addEventListener('touchend', () => { dragging = false; });

    // ── Controls ──
    btnPlay.addEventListener('click', toggle);
    btnPrev.addEventListener('click', prev);
    btnNext.addEventListener('click', next);

    // ── Search ──
    navSearch.addEventListener('click', () => {
      overlay.classList.add('open');
      setTimeout(() => searchField.focus(), 50);
      renderSearch('');
    });

    searchClose.addEventListener('click', () => {
      overlay.classList.remove('open');
      searchField.value = '';
    });

    searchField.addEventListener('input', () => renderSearch(searchField.value.trim()));

    function renderSearch(q) {
      let list = songs;
      if (q) {
        const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
        list = songs.filter(s => {
          const tl = s.title.toLowerCase();
          return terms.every(t => {
            const e = t.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');
            return new RegExp('\\b'+e,'i').test(tl) || tl.includes(t);
          });
        });
      }

      searchRes.innerHTML = list.map((s, vi) => `
        <div class="search-result-row" data-i="${s._i}">
          <span class="search-result-num">${String(vi+1).padStart(2,'0')}</span>
          <span class="search-result-title">${esc(s.title)}</span>
          <span class="search-result-dur">${isDummy(s.duration)?'--:--':fmt(s.duration)}</span>
        </div>
      `).join('');

      searchRes.querySelectorAll('.search-result-row').forEach(row => {
        row.addEventListener('click', () => {
          play(+row.dataset.i);
          overlay.classList.remove('open');
          searchField.value = '';
        });
      });
    }

    // ── Keyboard ──
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space')     { e.preventDefault(); toggle(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
    });

    // ── Init ──
    renderList();
  })();
  </script>

  <script src="https://www.youtube.com/iframe_api" async defer></script>
</body>
</html>
