name: Refresh catalog (daily health check)

# Keeps the vault fresh: probes every stale video, marks dead/private ones so
# they drop out of playback, and resurrects songs that come back.
#
# Requires two repo/action secrets:
#   PROD_URL   -> https://your-app.vercel.app
#   ADMIN_KEY  -> the value of your ADMIN_KEY env var

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/refresh
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          test -n "$PROD_URL"  || { echo "::warning::PROD_URL secret unset — skipping"; exit 0; }
          test -n "$ADMIN_KEY" || { echo "::warning::ADMIN_KEY secret unset — skipping"; exit 0; }
          curl -sf -X POST "$PROD_URL/api/refresh" \
            -H "Authorization: Bearer $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d '{"force":false}' || exit 1