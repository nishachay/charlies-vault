name: Apply admin track queue

# Self-serve content addition: the admin page (admin.html) lets a curator paste
# a YouTube URL, verify it's playable, and queue it (stored in the DB as
# pending_tracks). This workflow reads that queue, verifies + appends each to
# the vault roster, rebuilds the catalog + bundles it into index.html, commits,
# and pushes — which redeploys to Vercel.
#
# Requires repo/action secrets:
#   PROD_URL   -> https://your-app.vercel.app
#   ADMIN_KEY  -> the value of your ADMIN_KEY env var

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours, so queued additions ship promptly.
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard secrets
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          test -n "$PROD_URL"  || { echo "::warning::PROD_URL secret unset — skipping"; exit 0; }
          test -n "$ADMIN_KEY" || { echo "::warning::ADMIN_KEY secret unset — skipping"; exit 0; }

      # Apply against the active/deploy branch (new-ui), not the repo default (main).
      - uses: actions/checkout@v4
        with:
          ref: new-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci || npm install

      - name: Fetch + apply pending tracks
        id: apply
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          node scripts/apply_pending.js --api > .apply_out.txt 2>&1
          cat .apply_out.txt
          if grep -q "0/0 added" .apply_out.txt || grep -q "Nothing to apply" .apply_out.txt; then
            echo "NOOP=true" >> "$GITHUB_ENV"
          elif grep -q "0/[1-9]" .apply_out.txt; then
            echo "No playable tracks were new — nothing to rebuild."
            exit 0
          fi

      - name: Rebuild catalog + bundle
        if: env.NOOP != 'true'
        run: |
          npm run db:build
          npm run db:sync
          npm test

      - name: Commit + push
        if: env.NOOP != 'true'
        run: |
          git config user.name "outtake-bot"
          git config user.email "outtake-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "build(content): apply admin track queue"
            git push origin new-ui
          fi

      - name: Clear applied queue
        if: env.NOOP != 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          curl -sf -X POST "$PROD_URL/api/admin/clear" \
            -H "Authorization: Bearer $ADMIN_KEY" || echo "::warning::could not clear queue"
